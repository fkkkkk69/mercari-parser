on:
  workflow_dispatch: {}

concurrency:
  group: mercari-parser-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python parser.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
          RUN_ONCE: '1'
      - name: Save seen.json back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json debug_log.txt
          git diff --staged --quiet || git commit -m "Update seen items [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && break
            echo "Push failed, retry $i..."
            sleep 5
          done
